<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>映画の詳細</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .spoiler-content {
            display: none; /* 初期状態では非表示 */
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-end mt-2">
        <a th:href="@{/main}" class="btn btn-outline-secondary">トップへ戻る</a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <img th:src="'https://image.tmdb.org/t/p/w500' + ${movie.posterPath}"
                 alt="ポスター画像"
                 style="height: 500px; object-fit: cover; width: 100%;">
        </div>
        <div class="col-md-8">
            <h2 th:text="${movie.title}">映画のタイトル</h2>
            <p><strong>公開日:</strong> <span th:text="${movie.releaseDate}">公開日</span></p>
            <p><strong>評価:</strong> <span th:text="${movie.voteAverage}">評価</span></p>
            <p><strong>上映時間:</strong> <span th:text="${movie.runtime} + '分'">上映時間</span></p>
            <th:block th:if="${youtube != null}">
                <div>
                    <iframe th:src="${youtube}" width="560" height="315" frameborder="0" allowfullscreen></iframe>
                </div>
            </th:block>
            <th:block th:unless="${youtube != null}">
                予告映像情報がありません
            </th:block>
            <div class="col-12">
                <h3>あらすじ</h3>
                <p th:text="${movie.overview}">あらすじがここに表示されます。</p>
            </div>
        </div>
    </div>

    <ul class="nav nav-pills mt-4" id="myTab" role="tablist">
        <li class="nav-item">
            <a class="nav-link" id="ameba-tab" data-bs-toggle="pill" href="#webAmeba" role="tab">Ameba.jp</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="note-tab" data-bs-toggle="pill" href="#webNote" role="tab">Note.com</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" id="review-tab" data-bs-toggle="pill" href="#dbReviews" role="tab">レビュー</a>
        </li>
    </ul>

    <div class="tab-content mt-3" id="myTabContent">
        <div class="tab-pane fade" id="webAmeba" role="tabpanel" aria-labelledby="ameba-tab">
            <h5 class="mt-3">ameba.jpでの感想</h5>
            <ul id="amebaResults" class="list-group mt-3"></ul>
            <button id="loadMoreAmeba" class="btn btn-outline-success mt-2">次の10件</button>
        </div>

        <div class="tab-pane fade" id="webNote" role="tabpanel" aria-labelledby="note-tab">
            <h5 class="mt-3">note.comでの感想</h5>
            <ul id="noteResults" class="list-group mt-3"></ul>
            <button id="loadMoreNote" class="btn btn-outline-primary mt-2">次の10件</button>
        </div>

        <div class="tab-pane fade show active" id="dbReviews" role="tabpanel" aria-labelledby="review-tab">
            <h5 class="mt-3">ユーザーレビュー</h5>
            <div class="mb-2">
                <a th:href="@{/movie/{id}(id=${movieId}, sort='newest')}" class="btn btn-sm btn-outline-primary">新しい順</a>
                <a th:href="@{/movie/{id}(id=${movieId}, sort='oldest')}" class="btn btn-sm btn-outline-primary">古い順</a>
            </div>
            <button id="showReviewForm" class="btn btn-primary mb-3">レビューを投稿する</button>

            <div id="reviewFormCard" class="card mb-3" style="display: none;">
                <div class="card-body">
                    <h5 class="card-title">レビュー投稿</h5>
                    <form id="submitReviewForm" th:action="@{/reviews/{movieId}(movieId=${movieId})}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">ユーザー名</label>
                            <input type="text" class="form-control" id="username" name="username">
                        </div>
                        <div class="mb-3">
                            <label for="reviews" class="form-label">レビュー内容</label>
                            <textarea class="form-control" id="reviews" name="reviews" rows="3"></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="isSpoiler" name="isSpoiler" value="true">
                            <label class="form-check-label" for="isSpoiler">ネタバレあり</label>
                        </div>
                        <button type="submit" class="btn btn-success">投稿</button>
                        <button type="button" id="cancelReviewForm" class="btn btn-secondary">キャンセル</button>
                    </form>
                </div>
            </div>

            <ul id="userReviews" class="list-group mt-3">
                <li th:each="review : ${userReviews}" class="list-group-item">
                    <p><strong>ユーザー名:</strong> <span th:text="${review.username}"></span></p>
                    <p th:if="${review.isSpoiler}">
                        <a href="#" class="spoiler-toggle" th:data-review-id="${review.id}">ネタバレが含まれています。表示しますか？</a>
                        <span class="spoiler-content" th:id="'review-content-' + ${review.id}" th:text="${review.reviews}"></span>
                    </p>
                    <p th:unless="${review.isSpoiler}" th:text="${review.reviews}"></p>
                    <p><strong>投稿日時:</strong> <span th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                </li>
            </ul>
        </div>
    </div>
</div>

<span id="movieTitle" th:text="${movie.title}" style="display: none;"></span>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const showReviewFormButton = document.getElementById('showReviewForm');
        const reviewFormCard = document.getElementById('reviewFormCard');
        const cancelReviewFormButton = document.getElementById('cancelReviewForm');
        const reviewTab = new bootstrap.Tab(document.getElementById('review-tab'));
        reviewTab.show();
        loadMore('note');
        loadMore('ameba');

        showReviewFormButton.addEventListener('click', () => {
            reviewFormCard.style.display = 'block';
        });

        cancelReviewFormButton.addEventListener('click', () => {
            reviewFormCard.style.display = 'none';
        });

        const spoilerToggles = document.querySelectorAll('.spoiler-toggle');

        spoilerToggles.forEach(toggle => {
            toggle.addEventListener('click', function(event) {
                event.preventDefault();
                const reviewId = this.getAttribute('data-review-id');
                const contentElement = document.getElementById('review-content-' + reviewId);
                if (contentElement) {
                    this.style.display = 'none'; // 「表示しますか？」リンクを非表示
                    contentElement.style.display = 'block'; // レビュー内容を表示
                }
            });
        });
    });

    const keyword = document.getElementById('movieTitle').innerText;
    let notePage = 1;
    let amebaPage = 1;

    function loadMore(type) {
        const page = (type === 'note') ? notePage : amebaPage;
        const endpoint = (type === 'note') ? '/searchNote' : '/searchAmeba';
        const containerId = (type === 'note') ? 'noteResults' : 'amebaResults';

        fetch(`${endpoint}?keyword=${encodeURIComponent(keyword)}&page=${page}`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById(containerId);
                data.forEach(item => {
                    const li = document.createElement('li');
                    li.className = "list-group-item";
                    li.innerHTML = `<a href="${item.link}" target="_blank">${item.title}</a>`;
                    container.appendChild(li);
                });
                if (type === 'note') notePage++;
                else amebaPage++;
            });
    }

    document.getElementById('loadMoreNote').addEventListener('click', () => loadMore('note'));
    document.getElementById('loadMoreAmeba').addEventListener('click', () => loadMore('ameba'));
</script>
</body>
</html>
