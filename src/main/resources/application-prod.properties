spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?serverTimezone=JST&useUnicode=true&characterEncoding=utf8mb4
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.flyway.baseline-on-migrate=true
spotify.client.id=${SPOTIFY_CLIENT_ID_PROD}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET_PROD}
tmdb.api.key=${TMDB_API_KEY_PROD}
google.api.key=${GOOGLE_API_KEY_PROD}
google.api.note.cx=${GOOGLE_API_NOTE_CX_PROD}
google.api.ameba.cx=${GOOGLE_API_AMEBA_CX_PROD}
youtube.api.key=${YOUTUBE_API_KEY_PROD}

server.port=80
logging.level.com.example.movie=INFO